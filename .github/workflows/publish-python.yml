name: Build and Publish Python Package

# Be very careful granting extra permissions here, as this workflow uses third party actions.
# Prefer to pin to exact commits for third-party actions. I'm making an exception for actions
# maintained by GitHub itself.

# For now, just trigger this workflow manually.
on:
  workflow_dispatch:
    inputs:
      upload_to_pypi:
        description: "Upload generate package files to PyPI"
        required: true
        type: boolean
      pypi_environment:
        description: "Which PyPI instance to publish to"
        required: true
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build_sdist:
    name: Build Python sdist
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.8"
          cache: "pip"
      - run: pip install 'build==1.2.2'
      - name: Build sdist
        run: python3 -m build --sdist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: ./dist/*.gz
          if-no-files-found: error

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14, macos-latest]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build wheels
        uses: pypa/cibuildwheel@298ed2fb2c105540f5ed055e8a6ad78d82dd3a7e # v3.3.1
        env:
          # CIBuildWheel itself no longer supports earlier than Python 3.8, which is
          # the earliest we try to support here. Also likely cibuildwheel will soon
          # drop support for 3.8, see https://github.com/pypa/cibuildwheel/issues/2685
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_i686"
          CIBW_TEST_COMMAND: >
            python {package}/python/_jsonnet_test.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  upload_to_pypi:
    name: "Upload packages to PyPI"
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-24.04
    if: "${{ inputs.upload_to_pypi }}"
    permissions:
      contents: read
      id-token: write # Needed for PyPI Trusted Publishing
    environment:
      name: "${{ inputs.pypi_environment }}"
      url: "${{ inputs.pypi_environment == 'pypi' && 'https://pypi.org/p/jsonnet' || 'https://test.pypi.org/p/jsonnet' }}"
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: cibw-wheels
          pattern: cibw-wheels-*
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: sdist
          name: sdist
      - name: Flatten wheels to one directory
        run: |
          mkdir dist
          find cibw-wheels/ -type f -name '*.whl' -exec mv '{}' ./dist/ ';'
          find sdist/ -type f -name '*.gz' -exec mv '{}' ./dist/ ';'
      - name: Install OSS Exit Gate staging dependencies
        run: python3 -m pip install --upgrade pip keyring twine keyrings.google-artifactregistry-auth
      - name: Authenticate to Google Cloud (OSS Exit Gate WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Stage package in OSS Exit Gate Artifact Registry
        run: |
          python3 -m twine upload \
            --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/jsonnet--pypi \
            dist/*
      - name: Trigger OSS Exit Gate release
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo '{"publish_all": true}' > publish_all.json
          unset CLOUDSDK_CORE_PROJECT
          gcloud storage cp publish_all.json \
            "gs://oss-exit-gate-prod-projects-bucket/jsonnet/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
